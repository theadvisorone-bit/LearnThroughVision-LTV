<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Image Compressor - Reduce Photo Size Online</title>
<meta name="description" content="Compress JPG and PNG photos online for free. Your image never leaves your phone.">
<link rel="stylesheet" href="style.css">
</head><body>
<header><a href="index.html">FreeToolsHub</a></header>
<main>
<h1>Image Compressor</h1>
<div class="card">
<input type="file" id="file" accept="image/*">
<label>Quality: <span id="qv">70</span>%</label>
<input type="range" id="q" min="10" max="95" value="70">
<button onclick="compress()">Compress Image</button>
<p id="info"></p>
<img id="preview" style="max-width:100%;display:none">
<a id="dl" class="btn" style="display:none" download="compressed.jpg">Download Compressed Image</a>
</div>
<div class="ad"><!-- PASTE AD CODE HERE --></div>
<div class="card"><h2>How to use</h2><p>Choose a photo, pick the quality, then tap Compress. Everything happens on your device, so your photo stays private.</p></div>
</main>
<footer><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></footer>
<script>
var q=document.getElementById('q');
q.oninput=function(){document.getElementById('qv').textContent=q.value;};
function compress(){
  var f=document.getElementById('file').files[0];
  if(!f){alert('Choose an image first');return;}
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');
    c.width=img.width;c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);
    c.toBlob(function(b){
      var url=URL.createObjectURL(b);
      var p=document.getElementById('preview');
      p.src=url;p.style.display='block';
      var d=document.getElementById('dl');
      d.href=url;d.style.display='block';
      document.getElementById('info').textContent=
        'Before: '+(f.size/1024).toFixed(0)+' KB  |  After: '+(b.size/1024).toFixed(0)+' KB';
    },'image/jpeg',q.value/100);
  };
  img.src=URL.createObjectURL(f);
}
</script>
</body></html>
