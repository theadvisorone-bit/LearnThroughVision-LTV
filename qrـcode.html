<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free QR Code Generator - Create QR Codes Online</title>
<meta name="description" content="Create a free QR code from any link or text and download it as an image.">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head><body>
<header><a href="index.html">FreeToolsHub</a></header>
<main>
<h1>QR Code Generator</h1>
<div class="card">
<input id="text" placeholder="Enter a link or text">
<button onclick="make()">Generate QR Code</button>
<div id="qr" style="text-align:center;margin-top:12px"></div>
<a id="dl" class="btn" style="display:none" download="qrcode.png">Download QR Code</a>
</div>
<div class="ad"><!-- PASTE AD CODE HERE --></div>
<div class="card"><h2>How to use</h2><p>Type or paste your link, tap Generate, then download the image. It works for websites, WhatsApp links, Wi-Fi text and more.</p></div>
</main>
<footer><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></footer>
<script>
function make(){
  var t=document.getElementById('text').value.trim();
  if(!t){alert('Enter a link or text first');return;}
  var box=document.getElementById('qr');
  box.innerHTML='';
  new QRCode(box,{text:t,width:220,height:220});
  setTimeout(function(){
    var c=box.querySelector('canvas');
    var d=document.getElementById('dl');
    if(c){d.href=c.toDataURL('image/png');d.style.display='block';}
  },300);
}
</script>
</body></html>
