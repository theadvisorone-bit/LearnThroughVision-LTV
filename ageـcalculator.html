<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age Calculator - Find Your Exact Age Online</title>
<meta name="description" content="Free age calculator. Enter your date of birth to see your age in years, months and days.">
<link rel="stylesheet" href="style.css">
</head><body>
<header><a href="index.html">FreeToolsHub</a></header>
<main>
<h1>Age Calculator</h1>
<div class="card">
<label>Date of birth</label>
<input type="date" id="dob">
<button onclick="calc()">Calculate Age</button>
<h2 id="out"></h2>
</div>
<div class="ad"><!-- PASTE AD CODE HERE --></div>
<div class="card"><h2>How to use</h2><p>Pick your date of birth and tap Calculate to see your exact age, plus days until your next birthday.</p></div>
</main>
<footer><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></footer>
<script>
function calc(){
  var v=document.getElementById('dob').value;
  if(!v){alert('Pick your date of birth');return;}
  var b=new Date(v),n=new Date();
  if(b>n){alert('Date is in the future');return;}
  var y=n.getFullYear()-b.getFullYear();
  var m=n.getMonth()-b.getMonth();
  var d=n.getDate()-b.getDate();
  if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();}
  if(m<0){y--;m+=12;}
  var next=new Date(n.getFullYear(),b.getMonth(),b.getDate());
  if(next<=n)next.setFullYear(n.getFullYear()+1);
  var left=Math.ceil((next-n)/86400000);
  document.getElementById('out').innerHTML=
    y+' years, '+m+' months, '+d+' days<br><small>Next birthday in '+left+' days</small>';
}
</script>
</body></html>
